  <rect x="20" y="115" width="80" height="35" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"/>
  <text x="60" y="137" text-anchor="middle" font-size="10" fill="#6a1b9a">注册发现</text>
  
  <!-- 二级分支左1.2 -->
  <path d="M 160 185 Q 120 185 100 230" fill="none" stroke="#6a1b9a" stroke-width="1.5"/>
  <rect x="20" y="205" width="80" height="35" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"/>
  <text x="60" y="227" text-anchor="middle" font-size="10" fill="#6a1b9a">负载均衡</text>
  
  <!-- 左侧分支2: 运维监控 -->
  <path d="M 420 300 Q 350 300 300 300" fill="none" stroke="#c2185b" stroke-width="2"/>
  <rect x="160" y="275" width="140" height="50" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="230" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2185b">运维监控</text>
  
  <!-- 二级分支左2.1 -->
  <path d="M 160 300 Q 120 300 100 280" fill="none" stroke="#c2185b" stroke-width="1.5"/>
  <rect x="20" y="255" width="80" height="35" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="60" y="277" text-anchor="middle" font-size="10" fill="#c2185b">日志聚合</text>
  
  <!-- 二级分支左2.2 -->
  <path d="M 160 300 Q 120 300 100 330" fill="none" stroke="#c2185b" stroke-width="1.5"/>
  <rect x="20" y="305" width="80" height="35" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="60" y="327" text-anchor="middle" font-size="10" fill="#c2185b">链路追踪</text>
  
  <!-- 左侧分支3: 安全 -->
  <path d="M 420 300 Q 350 300 300 400" fill="none" stroke="#00695c" stroke-width="2"/>
  <rect x="160" y="375" width="140" height="50" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="230" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695c">安全认证</text>
  
  <!-- 二级分支左3.1 -->
  <path d="M 160 400 Q 120 400 100 370" fill="none" stroke="#00695c" stroke-width="1.5"/>
  <rect x="20" y="345" width="80" height="35" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1"/>
  <text x="60" y="367" text-anchor="middle" font-size="10" fill="#00695c">JWT/OAuth2</text>
  
  <!-- 二级分支左3.2 -->
  <path d="M 160 400 Q 120 400 100 430" fill="none" stroke="#00695c" stroke-width="1.5"/>
  <rect x="20" y="405" width="80" height="35" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1"/>
  <text x="60" y="427" text-anchor="middle" font-size="10" fill="#00695c">API网关鉴权</text>
