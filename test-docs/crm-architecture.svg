<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666" />
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999" />
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="900" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="600" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">CRM系统架构图</text>
  
  <!-- ===== 客户端层 ===== -->
  <g class="layer" transform="translate(0, 60)">
    <rect x="40" y="0" width="1120" height="80" rx="6" fill="#e8f4f8" stroke="#1565c0" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">客户端层 (Client Layer)</text>
    
    <rect x="200" y="35" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="290" y="60" text-anchor="middle" font-size="12" fill="#1565c0">Web管理端 (Vue3/React)</text>
    
    <rect x="510" y="35" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="600" y="60" text-anchor="middle" font-size="12" fill="#1565c0">移动端 App</text>
    
    <rect x="820" y="35" width="180" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="910" y="60" text-anchor="middle" font-size="12" fill="#1565c0">小程序端</text>
  </g>
  
  <!-- ===== 接入与网关层 ===== -->
  <g class="layer" transform="translate(0, 170)">
    <rect x="40" y="0" width="1120" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">接入与网关层 (Access and Gateway)</text>
    
    <rect x="150" y="35" width="160" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="230" y="60" text-anchor="middle" font-size="12" fill="#2e7d32">CDN / WAF</text>
    
    <rect x="370" y="35" width="160" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="450" y="60" text-anchor="middle" font-size="12" fill="#2e7d32">Nginx / ALB</text>
    
    <rect x="590" y="35" width="240" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="710" y="60" text-anchor="middle" font-size="12" fill="#2e7d32">API Gateway (Kong/Spring)</text>
    
    <rect x="890" y="35" width="160" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="970" y="60" text-anchor="middle" font-size="12" fill="#2e7d32">鉴权/限流/路由</text>
  </g>
  
  <!-- ===== 业务服务层 ===== -->
  <g class="layer" transform="translate(0, 280)">
    <rect x="40" y="0" width="1120" height="140" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#e65100">业务服务层 (Business Services)</text>
    
    <rect x="80" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="150" y="65" text-anchor="middle" font-size="11" fill="#e65100">用户与权限中心</text>
    
    <rect x="240" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="310" y="65" text-anchor="middle" font-size="11" fill="#e65100">客户与线索中心</text>
    
    <rect x="400" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="470" y="65" text-anchor="middle" font-size="11" fill="#e65100">销售与商机中心</text>
    
    <rect x="560" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="630" y="65" text-anchor="middle" font-size="11" fill="#e65100">营销与触达中心</text>
    
    <rect x="720" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="790" y="65" text-anchor="middle" font-size="11" fill="#e65100">客服与工单中心</text>
    
    <rect x="880" y="40" width="140" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="950" y="65" text-anchor="middle" font-size="11" fill="#e65100">BI数据分析</text>
    
    <rect x="1040" y="40" width="100" height="40" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="1090" y="65" text-anchor="middle" font-size="11" fill="#e65100">通知服务</text>
    
    <text x="600" y="110" text-anchor="middle" font-size="10" fill="#999">服务间通过内部 RPC/HTTP 通信</text>
  </g>
  
  <!-- ===== 中间件层 ===== -->
  <g class="layer" transform="translate(0, 450)">
    <rect x="40" y="0" width="1120" height="100" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2185b">中间件层 (Middleware)</text>
    
    <rect x="120" y="40" width="160" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="200" y="65" text-anchor="middle" font-size="11" fill="#c2185b">RabbitMQ / Kafka</text>
    
    <rect x="320" y="40" width="160" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="11" fill="#c2185b">Redis Cluster</text>
    
    <rect x="520" y="40" width="160" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="600" y="65" text-anchor="middle" font-size="11" fill="#c2185b">Elasticsearch</text>
    
    <rect x="720" y="40" width="160" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="800" y="65" text-anchor="middle" font-size="11" fill="#c2185b">Nacos / Consul</text>
    
    <rect x="920" y="40" width="160" height="40" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
    <text x="1000" y="65" text-anchor="middle" font-size="11" fill="#c2185b">MinIO / OSS</text>
  </g>
  
  <!-- ===== 数据持久层 ===== -->
  <g class="layer" transform="translate(0, 580)">
    <rect x="40" y="0" width="1120" height="100" rx="6" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#6a1b9a">数据持久层 (Data Persistence)</text>
    
    <rect x="200" y="40" width="180" height="40" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="290" y="65" text-anchor="middle" font-size="11" fill="#6a1b9a">MySQL / PostgreSQL</text>
    
    <rect x="430" y="40" width="180" height="40" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="520" y="65" text-anchor="middle" font-size="11" fill="#6a1b9a">MongoDB</text>
    
    <rect x="660" y="40" width="180" height="40" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="750" y="65" text-anchor="middle" font-size="11" fill="#6a1b9a">ClickHouse / StarRocks</text>
    
    <rect x="890" y="40" width="180" height="40" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="980" y="65" text-anchor="middle" font-size="11" fill="#6a1b9a">数据仓库</text>
  </g>
  
  <!-- ===== DevOps层 ===== -->
  <g class="layer" transform="translate(0, 710)">
    <rect x="40" y="0" width="1120" height="100" rx="6" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5" opacity="0.3"/>
    <text x="600" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695c">运维与可观测性 (DevOps and Observability)</text>
    
    <rect x="150" y="40" width="160" height="40" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
    <text x="230" y="65" text-anchor="middle" font-size="11" fill="#00695c">Docker + K8s</text>
    
    <rect x="350" y="40" width="160" height="40" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
    <text x="430" y="65" text-anchor="middle" font-size="11" fill="#00695c">GitLab CI / ArgoCD</text>
    
    <rect x="550" y="40" width="160" height="40" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
    <text x="630" y="65" text-anchor="middle" font-size="11" fill="#00695c">Prometheus + Grafana</text>
    
    <rect x="750" y="40" width="160" height="40" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
    <text x="830" y="65" text-anchor="middle" font-size="11" fill="#00695c">ELK / Loki</text>
    
    <rect x="950" y="40" width="160" height="40" rx="4" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
    <text x="1030" y="65" text-anchor="middle" font-size="11" fill="#00695c">SkyWalking</text>
  </g>
  
  <!-- ===== 连线 ===== -->
  <g class="connections" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- 客户端到接入层 -->
    <line x1="290" y1="180" x2="230" y2="205" />
    <line x1="600" y1="180" x2="450" y2="205" />
    <line x1="910" y1="180" x2="710" y2="205" />
    
    <!-- 接入层内部 -->
    <line x1="310" y1="225" x2="370" y2="225" />
    <line x1="530" y1="225" x2="590" y2="225" />
    <line x1="830" y1="225" x2="890" y2="225" />
    
    <!-- 接入层到业务层 -->
    <line x1="600" y1="250" x2="150" y2="320" />
    <line x1="600" y1="250" x2="310" y2="320" />
    <line x1="600" y1="250" x2="470" y2="320" />
    <line x1="600" y1="250" x2="630" y2="320" />
    <line x1="600" y1="250" x2="790" y2="320" />
    <line x1="600" y1="250" x2="950" y2="320" />
    <line x1="600" y1="250" x2="1090" y2="320" />
    
    <!-- 业务层到中间件 -->
    <line x1="310" y1="420" x2="200" y2="490" />
    <line x1="470" y1="420" x2="400" y2="490" />
    <line x1="630" y1="420" x2="600" y2="490" />
    <line x1="790" y1="420" x2="800" y2="490" />
    <line x1="950" y1="420" x2="1000" y2="490" />
    
    <!-- 中间件到数据层 -->
    <line x1="200" y1="550" x2="290" y2="620" />
    <line x1="400" y1="550" x2="520" y2="620" />
    <line x1="600" y1="550" x2="750" y2="620" />
    <line x1="800" y1="550" x2="980" y2="620" />
  </g>
  
  <!-- 虚线连线 (异步/DevOps) -->
  <g class="connections-dashed" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)">
    <!-- MQ异步流 -->
    <line x1="200" y1="510" x2="310" y2="420" />
    <line x1="200" y1="510" x2="950" y2="420" />
    
    <!-- DevOps到各层 -->
    <line x1="230" y1="710" x2="150" y2="620" />
    <line x1="430" y1="710" x2="400" y2="550" />
    <line x1="630" y1="710" x2="600" y2="380" />
  </g>
  
  <!-- 图例 -->
  <g class="legend" transform="translate(40, 840)">
    <line x1="0" y1="8" x2="30" y2="8" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="40" y="12" font-size="10" fill="#666">同步请求</text>
    
    <line x1="120" y1="8" x2="150" y2="8" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow-dashed)"/>
    <text x="160" y="12" font-size="10" fill="#666">异步/管理</text>
    
    <rect x="240" y="0" width="16" height="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="264" y="12" font-size="10" fill="#666">客户端</text>
    
    <rect x="330" y="0" width="16" height="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="354" y="12" font-size="10" fill="#666">接入层</text>
    
    <rect x="420" y="0" width="16" height="16" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="444" y="12" font-size="10" fill="#666">业务层</text>
    
    <rect x="510" y="0" width="16" height="16" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
    <text x="534" y="12" font-size="10" fill="#666">中间件</text>
    
    <rect x="600" y="0" width="16" height="16" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"/>
    <text x="624" y="12" font-size="10" fill="#666">数据层</text>
    
    <rect x="690" y="0" width="16" height="16" fill="#e0f2f1" stroke="#00695c" stroke-width="1"/>
    <text x="714" y="12" font-size="10" fill="#666">DevOps</text>
  </g>
</svg>
