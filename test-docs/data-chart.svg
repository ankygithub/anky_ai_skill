<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600">
  <!-- 背景 -->
  <rect width="1000" height="600" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="500" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">2024年Q3销售数据分析</text>
  
  <!-- ===== 饼图区域 ===== -->
  <g transform="translate(50, 60)">
    <text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">产品类别销售占比</text>
    
    <!-- 饼图 -->
    <g transform="translate(200, 160)">
      <!-- 电子产品 35% -->
      <path d="M 0,0 L 0,-100 A 100,100 0 0,1 95.11,30.9 Z" fill="#1565c0" stroke="white" stroke-width="2"/>
      <!-- 服装 25% -->
      <path d="M 0,0 L 95.11,30.9 A 100,100 0 0,1 -58.78,80.9 Z" fill="#2e7d32" stroke="white" stroke-width="2"/>
      <!-- 食品 20% -->
      <path d="M 0,0 L -58.78,80.9 A 100,100 0 0,1 -95.11,-30.9 Z" fill="#e65100" stroke="white" stroke-width="2"/>
      <!-- 家居 15% -->
      <path d="M 0,0 L -95.11,-30.9 A 100,100 0 0,1 30.9,-95.11 Z" fill="#6a1b9a" stroke="white" stroke-width="2"/>
      <!-- 其他 5% -->
      <path d="M 0,0 L 30.9,-95.11 A 100,100 0 0,1 0,-100 Z" fill="#999" stroke="white" stroke-width="2"/>
      
      <!-- 标签 -->
      <text x="45" y="20" text-anchor="middle" font-size="11" fill="white" font-weight="bold">35%</text>
      <text x="80" y="50" text-anchor="start" font-size="11" fill="#333">服装 25%</text>
      <text x="20" y="40" text-anchor="start" font-size="11" fill="#333">食品 20%</text>
      <text x="20" y="20" text-anchor="start" font-size="11" fill="#333">家居 15%</text>
      <text x="20" y="10" text-anchor="start" font-size="10" fill="#666">其他 5%</text>
    </g>
    
    <!-- 图例 -->
    <g transform="translate(80, 300)">
      <rect x="0" y="0" width="16" height="16" fill="#1565c0" rx="2"/>
      <text x="24" y="12" font-size="11" fill="#333">电子产品 (35%)</text>
      
      <rect x="0" y="25" width="16" height="16" fill="#2e7d32" rx="2"/>
      <text x="24" y="37" font-size="11" fill="#333">服装 (25%)</text>
      
      <rect x="0" y="50" width="16" height="16" fill="#e65100" rx="2"/>
      <text x="24" y="62" font-size="11" fill="#333">食品 (20%)</text>
      
      <rect x="0" y="75" width="16" height="16" fill="#6a1b9a" rx="2"/>
      <text x="24" y="87" font-size="11" fill="#333">家居 (15%)</text>
      
      <rect x="0" y="100" width="16" height="16" fill="#999" rx="2"/>
      <text x="24" y="112" font-size="11" fill="#333">其他 (5%)</text>
    </g>
  </g>
  
  <!-- ===== 柱状图区域 ===== -->
  <g transform="translate(500, 60)">
    <text x="225" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">月度销售额趋势 (万元)</text>
    
    <!-- Y轴 -->
    <line x1="50" y1="50" x2="50" y2="350" stroke="#333" stroke-width="1"/>
    <!-- X轴 -->
    <line x1="50" y1="350" x2="450" y2="350" stroke="#333" stroke-width="1"/>
    
    <!-- Y轴刻度 -->
    <g font-size="10" fill="#666" text-anchor="end">
      <text x="45" y="55">500</text>
      <text x="45" y="115">400</text>
      <text x="45" y="175">300</text>
      <text x="45" y="235">200</text>
      <text x="45" y="295">100</text>
      <text x="45" y="355">0</text>
    </g>
    
    <!-- 网格线 -->
    <g stroke="#eee" stroke-width="1">
      <line x1="50" y1="50" x2="450" y2="50" />
      <line x1="50" y1="110" x2="450" y2="110" />
      <line x1="50" y1="170" x2="450" y2="170" />
      <line x1="50" y1="230" x2="450" y2="230" />
      <line x1="50" y1="290" x2="450" y2="290" />
    </g>
    
    <!-- 柱状图 -->
    <g>
      <!-- 7月: 280万 -->
      <rect x="70" y="186" width="40" height="164" fill="#1565c0" rx="2"/>
      <text x="90" y="178" text-anchor="middle" font-size="10" fill="#1565c0">280</text>
      
      <!-- 8月: 350万 -->
      <rect x="130" y="146" width="40" height="204" fill="#2e7d32" rx="2"/>
      <text x="150" y="138" text-anchor="middle" font-size="10" fill="#2e7d32">350</text>
      
      <!-- 9月: 420万 -->
      <rect x="190" y="106" width="40" height="244" fill="#e65100" rx="2"/>
      <text x="210" y="98" text-anchor="middle" font-size="10" fill="#e65100">420</text>
      
      <!-- 10月: 380万 -->
      <rect x="250" y="126" width="40" height="224" fill="#6a1b9a" rx="2"/>
      <text x="270" y="118" text-anchor="middle" font-size="10" fill="#6a1b9a">380</text>
      
      <!-- 11月: 450万 -->
      <rect x="310" y="86" width="40" height="264" fill="#c2185b" rx="2"/>
      <text x="330" y="78" text-anchor="middle" font-size="10" fill="#c2185b">450</text>
      
      <!-- 12月: 480万 -->
      <rect x="370" y="66" width="40" height="284" fill="#00695c" rx="2"/>
      <text x="390" y="58" text-anchor="middle" font-size="10" fill="#00695c">480</text>
    </g>
    
    <!-- X轴标签 -->
    <g font-size="11" fill="#333" text-anchor="middle">
      <text x="90" y="368">7月</text>
      <text x="150" y="368">8月</text>
      <text x="210" y="368">9月</text>
      <text x="270" y="368">10月</text>
      <text x="330" y="368">11月</text>
      <text x="390" y="368">12月</text>
    </g>
  </g>
  
  <!-- 底部说明 -->
  <text x="500" y="580" text-anchor="middle" font-size="11" fill="#666">数据来源：销售管理系统 | 统计周期：2024年7月-12月</text>
</svg>
