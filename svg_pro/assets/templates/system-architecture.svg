<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666" />
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- 用户层 -->
  <g class="layer" transform="translate(0, 40)">
    <text x="400" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">用户层</text>
    <rect x="300" y="35" width="200" height="50" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="12" fill="#1565c0">Web/Mobile 客户端</text>
  </g>
  
  <!-- 应用层 -->
  <g class="layer" transform="translate(0, 160)">
    <text x="400" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">应用层</text>
    <rect x="150" y="35" width="160" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="230" y="65" text-anchor="middle" font-size="12" fill="#2e7d32">API Gateway</text>
    
    <rect x="320" y="35" width="160" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="400" y="65" text-anchor="middle" font-size="12" fill="#2e7d32">Auth Service</text>
    
    <rect x="490" y="35" width="160" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
    <text x="570" y="65" text-anchor="middle" font-size="12" fill="#2e7d32">BFF Service</text>
  </g>
  
  <!-- 服务层 -->
  <g class="layer" transform="translate(0, 280)">
    <text x="400" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">服务层</text>
    <rect x="100" y="35" width="140" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="170" y="65" text-anchor="middle" font-size="12" fill="#e65100">User Service</text>
    
    <rect x="250" y="35" width="140" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="320" y="65" text-anchor="middle" font-size="12" fill="#e65100">Order Service</text>
    
    <rect x="400" y="35" width="140" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="470" y="65" text-anchor="middle" font-size="12" fill="#e65100">Pay Service</text>
    
    <rect x="550" y="35" width="140" height="50" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
    <text x="620" y="65" text-anchor="middle" font-size="12" fill="#e65100">Notify Service</text>
  </g>
  
  <!-- 数据层 -->
  <g class="layer" transform="translate(0, 400)">
    <text x="400" y="20" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">数据层</text>
    <rect x="200" y="35" width="160" height="50" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="280" y="65" text-anchor="middle" font-size="12" fill="#6a1b9a">MySQL Cluster</text>
    
    <rect x="380" y="35" width="160" height="50" rx="4" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
    <text x="460" y="65" text-anchor="middle" font-size="12" fill="#6a1b9a">Redis Cluster</text>
  </g>
  
  <!-- 跨层连线 -->
  <g class="connections" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- 用户层到应用层 -->
    <line x1="400" y1="125" x2="400" y2="160" />
    
    <!-- 应用层到服务层 -->
    <line x1="230" y1="245" x2="170" y2="280" />
    <line x1="400" y1="245" x2="320" y2="280" />
    <line x1="400" y1="245" x2="470" y2="280" />
    <line x1="570" y1="245" x2="620" y2="280" />
    
    <!-- 服务层到数据层 -->
    <line x1="170" y1="365" x2="280" y2="400" />
    <line x1="320" y1="365" x2="280" y2="400" />
    <line x1="470" y1="365" x2="460" y2="400" />
    <line x1="620" y1="365" x2="460" y2="400" />
  </g>
  
  <!-- 图例 -->
  <g class="legend" transform="translate(40, 520)">
    <rect x="0" y="0" width="16" height="16" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
    <text x="24" y="13" font-size="10" fill="#666">用户层</text>
    
    <rect x="100" y="0" width="16" height="16" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
    <text x="124" y="13" font-size="10" fill="#666">应用层</text>
    
    <rect x="200" y="0" width="16" height="16" fill="#fff3e0" stroke="#e65100" stroke-width="1"/>
    <text x="224" y="13" font-size="10" fill="#666">服务层</text>
    
    <rect x="300" y="0" width="16" height="16" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1"/>
    <text x="324" y="13" font-size="10" fill="#666">数据层</text>
  </g>
</svg>
